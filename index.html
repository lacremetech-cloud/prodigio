<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PRODIGIO — Immobilier d'exception. Chaque bien devient une marque : branding, acquisition ciblée et performance jusqu'à la vente."
    />
    <title>PRODIGIO — Immobilier d'exception</title>

    <!-- SEO / partage social. Les valeurs par défaut ci-dessous concernent
         l'écran d'accueil ; le pré-rendu (scripts/prerender.mjs) les remplace
         page par page à la compilation. -->
    <link rel="canonical" href="https://www.prodigio.fr/" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRODIGIO" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="PRODIGIO — Immobilier d'exception" />
    <meta
      property="og:description"
      content="PRODIGIO — Immobilier d'exception. Chaque bien devient une marque : branding, acquisition ciblée et performance jusqu'à la vente."
    />
    <meta property="og:url" content="https://www.prodigio.fr/" />
    <meta property="og:image" content="https://www.prodigio.fr/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PRODIGIO — Immobilier d'exception" />
    <meta
      name="twitter:description"
      content="PRODIGIO — Immobilier d'exception. Chaque bien devient une marque : branding, acquisition ciblée et performance jusqu'à la vente."
    />
    <meta name="twitter:image" content="https://www.prodigio.fr/og-cover.jpg" />
    <!--PRERENDER_HEAD-->

    <!-- Polices de luxe : Cormorant Garamond / Playfair Display (titres), Jost (corps).
         Chargement NON bloquant : la page s'affiche immédiatement (police système),
         puis les polices de luxe se substituent dès qu'elles sont prêtes. Si le réseau
         Google Fonts est lent ou inaccessible, le site reste parfaitement utilisable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:wght@400;500;600;700&family=Jost:wght@200;300;400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:wght@400;500;600;700&family=Jost:wght@200;300;400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Écran de chargement de secours : visible dès la première peinture, avant
         même que le JS ne s'exécute. Remplacé par l'application dès que React démarre.
         Garantit qu'on ne voit jamais un écran noir muet pendant le chargement. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #0a0a0a;
        color: #f5f4f1;
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        text-align: center;
        padding: 1.5rem;
      }
      #boot .brand {
        font-size: 1.75rem;
        font-weight: 300;
        letter-spacing: 0.35em;
      }
      #boot .spinner {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-top-color: rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot .hint {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.8rem;
        color: rgba(245, 244, 241, 0.7);
        max-width: 22rem;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- PRERENDER_BODY_START -->
      <!-- Fallback affiché tant que React n'a pas pris la main. En production,
           le pré-rendu remplace ce bloc par le vrai contenu de chaque page
           (visible par les robots et les navigateurs sans JavaScript). React
           reprend la main dès qu'il démarre. -->
      <div id="boot">
        <div class="brand">PRODIGIO</div>
        <div class="spinner"></div>
        <noscript>
          <p class="hint">
            Ce site est optimisé avec JavaScript. Activez-le pour la version
            interactive, puis rechargez la page.
          </p>
        </noscript>
      </div>
      <!-- PRERENDER_BODY_END -->
    </div>

    <!-- Garde-fou : si l'application n'a pas démarré après quelques secondes
         (JS bloqué, navigateur incompatible, réseau coupé…), on remplace le
         spinner infini par un message clair plutôt que de laisser « tourner ». -->
    <script>
      window.setTimeout(function () {
        var boot = document.getElementById('boot')
        if (!boot) return // React a démarré : le fallback a déjà disparu.
        boot.innerHTML =
          '<div class="brand">PRODIGIO</div>' +
          '<p class="hint">Le chargement prend plus de temps que prévu. ' +
          'Vérifiez votre connexion, puis rechargez la page.</p>' +
          '<button class="hint" style="margin-top:.5rem;padding:.6rem 1.4rem;' +
          'background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);' +
          'color:#f5f4f1;cursor:pointer;letter-spacing:.15em;text-transform:uppercase" ' +
          "onclick=\"window.location.reload()\">Recharger</button>"
      }, 8000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
